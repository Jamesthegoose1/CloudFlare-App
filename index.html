<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin Monitor Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:#071018;color:#e6eef8;margin:0;padding:18px}
.panel{max-width:1100px;margin:0 auto;background:#0f1720;padding:18px;border-radius:14px;box-shadow:0 12px 30px rgba(2,6,23,.6)}
header{display:flex;justify-content:space-between;align-items:center}
input, button{padding:8px;border-radius:8px;border:0;background:#0b1220;color:inherit}
.log{padding:10px;border-bottom:1px solid rgba(255,255,255,.03)}
.meta{font-size:12px;color:#8fa3bf}
.controls{display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<div class="panel">
<header>
<div>
<h2 style="margin:0">Admin Monitor</h2>
<div class="meta">Live admin action feed</div>
</div>
<div class="controls">
<input id="apiKey" placeholder="Paste API key" style="width:320px" />
<button id="refreshBtn">Refresh</button>
</div>
</header>


<div style="margin-top:12px;display:flex;gap:8px">
<input id="filterInput" placeholder="filter by admin name or action" style="flex:1" />
<select id="limitSelect"><option>50</option><option>100</option><option>200</option></select>
</div>


<div id="logs" style="margin-top:12px;max-height:600px;overflow:auto"></div>
</div>


<script>
const workerBase = 'https://YOUR_WORKER_SUBDOMAIN.workers.dev' // update me


async function fetchLogs() {
const key = document.getElementById('apiKey').value.trim()
if (!key) return
const limit = document.getElementById('limitSelect').value || 100
const res = await fetch(`${workerBase}/logs?limit=${limit}`, { headers: { 'x-api-key': key }})
if (!res.ok) { document.getElementById('logs').innerText = 'Error: ' + res.status; return }
const data = await res.json()
render(data.logs || [])
}


function render(logs) {
const container = document.getElementById('logs')
container.innerHTML = ''
const filter = (document.getElementById('filterInput').value || '').toLowerCase()
logs.forEach(l => {
const text = `${l.admin?.name || 'system'} — ${l.action} — ${JSON.stringify(l.target||{})}`
if (filter && !text.toLowerCase().includes(filter)) return
const d = document.createElement('div')
d.className = 'log'
d.innerHTML = `<div style='display:flex;justify-content:space-between'><div><b>${l.admin?.name||'system'}</b> — ${l.action}</div><div class='meta'>${new Date((l.timestamp||Date.now())*1000).toLocaleString()}</div></div><div class='meta'>${JSON.stringify(l.extra||{})}</div>`
container.appendChild(d)
})
}


document.getElementById('refreshBtn').addEventListener('click', fetchLogs)
document.getElementById('filterInput').addEventListener('input', () => fetchLogs())
setInterval(fetchLogs, 5000)
</script>
</body>
</html>
